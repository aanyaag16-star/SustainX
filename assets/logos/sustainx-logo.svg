<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="sustainx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164A35" />
      <stop offset="100%" stop-color="#238B5A" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="100%" stop-color="#D6A84F" />
    </linearGradient>
  </defs>
  <!-- Icon Mark: Hexagonal leaf shield -->
  <g transform="translate(6, 6)">
    <rect width="48" height="48" rx="14" fill="url(#sustainx-grad)" />
    <!-- Leaf veins & stylized X -->
    <path d="M16 32 C16 20, 26 14, 34 16 C32 26, 26 34, 16 32 Z" fill="#DFF3E5" />
    <path d="M22 28 C26 24, 30 20, 34 16" stroke="#238B5A" stroke-width="2.2" stroke-linecap="round" />
    <path d="M20 22 C24 22, 28 20, 31 18" stroke="#238B5A" stroke-width="1.6" stroke-linecap="round" />
    <!-- Small golden sustainability spark -->
    <circle cx="34" cy="16" r="3.5" fill="url(#gold-grad)" />
  </g>
  <!-- Typography -->
  <text x="66" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800" fill="#164A35" letter-spacing="-0.5">SUSTAIN<tspan fill="#238B5A">X</tspan></text>
  <text x="68" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#56695F" letter-spacing="1.5">GREEN CAMPUS CHALLENGE</text>
</svg>
