<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Score Audit History | SUSTAINX Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

  <div class="admin-layout">
    
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <a href="dashboard.html" class="brand-logo" style="color: #FFF;">
          <div class="brand-logo-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 12"/></svg>
          </div>
          <div>
            <span>SUSTAIN<span style="color: #55D48D;">X</span></span>
            <span class="brand-tag" style="color: #79E2A8;">Admin Console</span>
          </div>
        </a>
      </div>

      <nav class="admin-sidebar-menu">
        <a href="dashboard.html" class="admin-nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          <span>Dashboard</span>
        </a>

        <a href="scores.html" class="admin-nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          <span>Update Scores</span>
        </a>

        <a href="schools.html" class="admin-nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Manage Schools</span>
        </a>

        <a href="history.html" class="admin-nav-item active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Score History</span>
        </a>

        <a href="announcements.html" class="admin-nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
          <span>Announcements</span>
        </a>

        <div style="margin: 1.5rem 0 0.5rem; padding-top: 1rem; border-top: 1px solid rgba(255, 255, 255, 0.1);">
          <a href="../leaderboard.html" class="admin-nav-item" target="_blank">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            <span>Live Leaderboard ↗</span>
          </a>
        </div>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="#" class="admin-nav-item admin-logout-btn" style="color: #FF8E8E;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Log Out</span>
        </a>
      </div>
    </aside>

    <!-- Main Workspace -->
    <div class="admin-main">
      
      <!-- Topbar -->
      <header class="admin-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="btn btn-icon admin-mobile-toggle" id="adminSidebarToggle" style="display: none;" aria-label="Toggle drawer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div>
            <h2 style="font-size: 1.25rem;">Score Entry Audit History</h2>
          </div>
        </div>

        <a href="scores.html" class="btn btn-primary btn-sm">
          + Add New Score Entry
        </a>
      </header>

      <!-- Content -->
      <main class="admin-content">
        
        <!-- Multi-Filter Toolbar -->
        <div class="card" style="padding: 1.25rem 1.5rem; margin-bottom: 1.75rem;">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
            
            <div>
              <label class="form-label" style="font-size: 0.8rem;" for="historyFilterSchool">Filter by School</label>
              <select id="historyFilterSchool" class="form-control form-select">
                <option value="all">All Schools</option>
              </select>
            </div>

            <div>
              <label class="form-label" style="font-size: 0.8rem;" for="historyFilterCategory">Filter by Category</label>
              <select id="historyFilterCategory" class="form-control form-select">
                <option value="all">All Categories</option>
                <option value="Sustainable Events">Sustainable Events</option>
                <option value="Reuse & Resource Sharing">Reuse & Resource Sharing</option>
                <option value="Waste Collection Drive">Waste Collection Drive</option>
                <option value="Sustainability Participation">Sustainability Participation</option>
                <option value="Innovation Bonus">Innovation Bonus</option>
              </select>
            </div>

            <div>
              <label class="form-label" style="font-size: 0.8rem;" for="historyFilterMonth">Filter by Month</label>
              <select id="historyFilterMonth" class="form-control form-select">
                <option value="all">All Months</option>
                <option value="September">September</option>
                <option value="August">August</option>
                <option value="July">July</option>
              </select>
            </div>

            <div>
              <label class="form-label" style="font-size: 0.8rem;" for="historyFilterPointsType">Points Type</label>
              <select id="historyFilterPointsType" class="form-control form-select">
                <option value="all">All Points (Positive &amp; Penalty)</option>
                <option value="positive">Awards Only (+Points)</option>
                <option value="negative">Penalties Only (-Points)</option>
              </select>
            </div>

          </div>
        </div>

        <!-- History Records Table -->
        <div class="card" style="padding: 0; overflow: hidden;">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>School</th>
                  <th>Category</th>
                  <th>Activity / Event</th>
                  <th>Points</th>
                  <th>Status</th>
                  <th>Auditor</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="adminHistoryTableBody">
                <!-- Rendered dynamically by admin.js -->
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/data-store.js"></script>
  <script src="../js/utils.js"></script>
    <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
